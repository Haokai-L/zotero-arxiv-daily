name: CCF Consolidated Daily Preview (No Email)
on:
  push:
    branches: [feature/ccf-a-daily]
    paths:
      - '.github/workflows/ccf-daily-preview.yml'
      - 'scripts/ccf_daily_preview.py'
      - 'tests/test_ccf_daily_preview.py'
      - 'scripts/ccf_r5_mail.py'
      - 'scripts/ccf_daily_candidates.py'
      - 'scripts/ccf_incremental.py'
      - 'scripts/ccf_send_engine.py'
      - 'scripts/ccf_smtp_submission.py'
      - 'tests/test_ccf_daily_delivery.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ccf-daily-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/feature/ccf-a-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout developer branch
        uses: actions/checkout@v6
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install original scorer and preview dependencies
        run: |
          python -m pip install 'PyYAML>=6,<7' 'numpy>=2,<3' 'omegaconf>=2.3,<3' 'openai>=2,<3' 'tiktoken>=0.8,<1' 'loguru>=0.7,<1'
          python -m pip install 'pyzotero>=1.10,<2' 'sentence-transformers>=5,<6' 'transformers>=4.55,<5'
      - name: Run consolidated and critical safety regression tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_ccf_daily_preview.py -v
          python -m unittest discover -s tests -p test_ccf_r63.py -v
          python -m unittest discover -s tests -p test_ccf_r64.py -v
      - name: Snapshot production data checksums
        run: |
          sha256sum data/ccf_sent_history.json > .ccf-history.sha
          sha256sum data/ccf_delivery_ledger.json > .ccf-ledger.sha
          sha256sum data/ccf_candidate_state.json > .ccf-candidates.sha
      - name: Refresh all 16 formal sources in an ephemeral candidate snapshot
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          mkdir -p ccf-daily-work
          cp data/ccf_candidate_state.json ccf-daily-work/candidate_state.json
          python scripts/ccf_incremental.py \
            --state ccf-daily-work/candidate_state.json \
            --history data/ccf_sent_history.json \
            --output ccf-daily-work/discovery \
            --lookback 60 --crossref-pages 4
          echo 'Discovery writes only the ephemeral runner copy; no repository writes.'
      - name: Select recent, unsent, unreserved candidates for bounded verification
        run: |
          python scripts/ccf_daily_candidates.py \
            --state ccf-daily-work/candidate_state.json \
            --history data/ccf_sent_history.json \
            --ledger data/ccf_delivery_ledger.json \
            --per-venue 5 \
            --output ccf-daily-work/verification_queue.json
      - name: Independently verify selected journal and main-conference records
        run: |
          python scripts/ccf_r6_verify.py \
            --state ccf-daily-work/verification_queue.json \
            --output ccf-daily-verified \
            --per-venue 5
      - name: Enrich verified CCF abstracts
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python scripts/ccf_paper_enrichment.py \
            --input ccf-daily-verified/verified_candidates.csv \
            --per-venue 5 \
            --output-dir ccf-daily-enriched
      - name: Genuine Zotero scoring, verified selection and DeepSeek email HTML preview
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          PYTHONPATH: src
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          test -n "$ZOTERO_ID" && test -n "$ZOTERO_KEY"
          python scripts/ccf_daily_preview.py \
            --verified ccf-daily-verified/verified_candidates.csv \
            --enriched ccf-daily-enriched/enriched_candidates.csv \
            --out-dir ccf-daily-preview
          test -s ccf-daily-preview/email_preview.html
      - name: Assert production data unchanged and no mail sent
        if: always()
        run: |
          sha256sum -c .ccf-history.sha
          sha256sum -c .ccf-ledger.sha
          sha256sum -c .ccf-candidates.sha
          echo 'Consolidated email preview only; SMTP was never invoked.'
      - name: Persist successful candidate refresh on feature branch only
        if: success()
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/ccf-a-daily"
          sha256sum -c .ccf-history.sha
          sha256sum -c .ccf-ledger.sha
          python - <<'PY'
          import json
          from pathlib import Path
          fresh=json.loads(Path("ccf-daily-work/candidate_state.json").read_text(encoding="utf-8"))
          old=json.loads(Path("data/ccf_candidate_state.json").read_text(encoding="utf-8"))
          if fresh.get("schema_version")!=1 or not isinstance(fresh.get("papers"),dict):
              raise SystemExit("Invalid refreshed candidate state")
          if len(fresh["papers"])<len(old["papers"]):
              raise SystemExit("Refusing candidate-state data loss")
          if any(k not in fresh["papers"] for k in old["papers"]):
              raise SystemExit("Refusing previously known DOI/key deletion")
          preview=json.loads(Path("ccf-daily-preview/consolidated_audit.json").read_text(encoding="utf-8"))
          if preview["email_sent"] is not False or preview["selected_count"]<1 or preview["deepseek_generated"]!=preview["selected_count"]:
              raise SystemExit("Incomplete or unsafe preview: candidate persistence disabled")
          PY
          cp ccf-daily-work/candidate_state.json data/ccf_candidate_state.json
          if git diff --quiet -- data/ccf_candidate_state.json; then
            echo "No candidate-state changes to persist."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- data/ccf_candidate_state.json
            test "$(git diff --cached --name-only)" = "data/ccf_candidate_state.json"
            git commit -m "data(ccf): checkpoint verified daily discovery [skip ci]"
            commit_sha="$(git rev-parse HEAD)"
            git push origin HEAD:refs/heads/feature/ccf-a-daily
            remote_sha="$(git ls-remote origin refs/heads/feature/ccf-a-daily | cut -f1)"
            test "$remote_sha" = "$commit_sha"
            echo "Candidate state persisted with verified remote commit."
          fi
          sha256sum -c .ccf-history.sha
          sha256sum -c .ccf-ledger.sha
          echo "No SMTP was invoked; history/ledger byte-identical."
      - name: Upload only short-lived HTML preview (no audit archives)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ccf-html-preview
          path: ccf-daily-preview/email_preview.html
          retention-days: 1
          if-no-files-found: error
