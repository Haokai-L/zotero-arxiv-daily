name: CCF daily development (preview or explicit TEST)
on:
  push:
    branches: [feature/ccf-a-daily]
    paths:
      - '.github/workflows/ccf-daily-preview.yml'
      - 'scripts/ccf_daily.py'
      - 'scripts/ccf_*.py'
      - 'config/ccf_*.yaml'
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: ccf-daily-development
  cancel-in-progress: false
jobs:
  daily:
    if: github.ref == 'refs/heads/feature/ccf-a-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install existing scoring dependencies
        run: |
          python -m pip install 'PyYAML>=6,<7' 'numpy>=2,<3' 'omegaconf>=2.3,<3' 'openai>=2,<3' 'tiktoken>=0.8,<1' 'loguru>=0.7,<1' 'pyzotero>=1.10,<2' 'sentence-transformers>=5,<6' 'transformers>=4.55,<5'
      - name: Run unified CCF entrypoint
        env:
          MODE: ${{ inputs.mode || 'preview' }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          SENDER: ${{ inputs.mode == 'test' && secrets.SENDER || '' }}
          RECEIVER: ${{ inputs.mode == 'test' && secrets.RECEIVER || '' }}
          SENDER_PASSWORD: ${{ inputs.mode == 'test' && secrets.SENDER_PASSWORD || '' }}
          CCF_SMTP_AUTHORIZATION: ${{ inputs.mode == 'test' && 'TEST_ONLY' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/ccf_daily.py --mode "$MODE"
      - name: Short-lived HTML only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ccf-html-preview
          path: ccf-output/email_preview.html
          retention-days: 1
          if-no-files-found: ignore
