name: CCF Daily Papers
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ccf-daily-main
  cancel-in-progress: false
jobs:
  daily:
    if: github.repository == 'Haokai-L/zotero-arxiv-daily' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install existing scoring dependencies
        run: |
          python -m pip install 'PyYAML>=6,<7' 'numpy>=2,<3' 'omegaconf>=2.3,<3' 'openai>=2,<3' 'tiktoken>=0.8,<1' 'loguru>=0.7,<1' 'pyzotero>=1.10,<2' 'sentence-transformers>=5,<6' 'transformers>=4.55,<5'
      - name: Fetch, recommend and send up to three CCF papers
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          CCF_SMTP_AUTHORIZATION: DAILY_APPROVED
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/ccf_daily.py --mode daily --out "$RUNNER_TEMP/ccf-output"
