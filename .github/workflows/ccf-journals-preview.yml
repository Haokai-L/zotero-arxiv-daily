name: CCF Journal Preview
on:
  push:
    branches:
      - feature/ccf-a-daily
    paths:
      - ".github/workflows/ccf-journals-preview.yml"
      - "config/journal_source_map.yaml"
      - "config/ccf_a_venues.yaml"
      - "scripts/collect_ccf_journals.py"
      - "scripts/ccf_journal_quality.py"
      - "tests/test_ccf_journal_quality.py"
permissions:
  contents: read
concurrency:
  group: ccf-journal-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview-journals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: python -m pip install "PyYAML>=6,<7"
      - name: Offline R3-2 journal quality tests
        run: python -m unittest discover -s tests -p test_ccf_journal_quality.py -v
      - name: Collect and audit six journals
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/collect_ccf_journals.py
      - name: Upload audit reports even if checks fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ccf-journal-r32-audit
          path: ccf-preview/
          retention-days: 7
          if-no-files-found: warn
