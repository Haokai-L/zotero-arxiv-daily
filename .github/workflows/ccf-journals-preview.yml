

name: CCF Journal Preview

on:
  push:
    branches:
      - feature/ccf-a-daily
    paths:
      - ".github/workflows/ccf-journals-preview.yml"
      - "scripts/collect_ccf_journals.py"
      - "config/ccf_a_venues.yaml"

permissions:
  contents: read

concurrency:
  group: ccf-journal-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-journals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install "PyYAML>=6,<7"

      - name: Collect six journal previews
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/collect_ccf_journals.py

      - name: Upload audit files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ccf-journal-preview
          path: ccf-preview/
          if-no-files-found: warn
          retention-days: 7
