name: CCF R5 Chinese Email Preview (No Send)
on:
  push:
    branches: [feature/ccf-a-daily]
    paths:
      - '.github/workflows/ccf-r5-email-preview.yml'
      - 'config/ccf_r5_mail.yaml'
      - 'scripts/ccf_r5_prepare.py'
      - 'scripts/ccf_r5_mail.py'
      - 'tests/test_ccf_r5.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ccf-r5-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  email-preview:
    if: github.ref == 'refs/heads/feature/ccf-a-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout developer branch only
        uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install offline and scoring dependencies
        run: |
          python -m pip install 'PyYAML>=6,<7' 'numpy>=2,<3' 'omegaconf>=2.3,<3' 'openai>=2,<3' 'tiktoken>=0.8,<1' 'loguru>=0.7,<1'
      - name: Test R5 preview safety, email HTML, history non-mutation
        run: python -m unittest discover -s tests -p test_ccf_r5.py -v
      - name: Sample unsent papers from durable candidate state
        run: |
          python scripts/ccf_r5_prepare.py \
            --state data/ccf_candidate_state.json \
            --history data/ccf_sent_history.json \
            --whitelist config/ccf_a_venues.yaml \
            --per-venue 4 \
            --out ccf-r5-preview/candidates.csv
      - name: Retrieve real abstracts without preprint discovery
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python scripts/ccf_paper_enrichment.py \
            --input ccf-r5-preview/candidates.csv \
            --per-venue 4 --output-dir ccf-r5-work
      - name: Score with unmodified upstream Zotero reranker
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          PYTHONPATH: src
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          test -n "$ZOTERO_ID" && test -n "$ZOTERO_KEY" || { echo 'Zotero credentials missing; cannot produce real scores'; exit 1; }
          python -m pip install 'pyzotero>=1.10,<2' 'sentence-transformers>=5,<6' 'transformers>=4.55,<5'
          python scripts/ccf_recommend_preview.py \
            --input ccf-r5-work/enriched_candidates.csv \
            --output ccf-r5-work/recommendations.json \
            --max-corpus 150
      - name: Render Chinese HTML only, without sending
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
        run: |
          python scripts/ccf_r5_mail.py \
            --input ccf-r5-work/recommendations.json \
            --config config/ccf_r5_mail.yaml \
            --whitelist config/ccf_a_venues.yaml \
            --out-dir ccf-r5-preview
          test -f ccf-r5-preview/email_preview.html
          echo 'HTML preview generated. NO EMAIL HAS BEEN SENT.'
      - name: Upload preview audit, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccf-r5-email-preview
          path: |
            ccf-r5-preview/
            ccf-r5-work/enrichment_audit.json
          retention-days: 7
          if-no-files-found: warn
