name: CCF R6 Verified Sources and Three-Day Replay (No Email)
on:
  push:
    branches: [feature/ccf-a-daily]
    paths:
      - '.github/workflows/ccf-r6-verify-replay.yml'
      - 'scripts/ccf_r6_verify.py'
      - 'scripts/ccf_r6_replay.py'
      - 'tests/test_ccf_r6.py'
      - 'docs/ccf-r6-verification.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ccf-r6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-replay:
    if: github.ref == 'refs/heads/feature/ccf-a-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install offline dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'numpy>=2,<3' 'omegaconf>=2.3,<3' 'openai>=2,<3' 'tiktoken>=0.8,<1' 'loguru>=0.7,<1'
      - name: Offline adversarial verification and replay tests
        run: python -m unittest discover -s tests -p test_ccf_r6.py -v
      - name: Hash persistent send history
        run: sha256sum data/ccf_sent_history.json > .r6-history-checksum
      - name: Independently cross-check sample with publisher and official main-paper lists
        run: |
          python scripts/ccf_r6_verify.py --state data/ccf_candidate_state.json \
            --output ccf-r6-audit --per-venue 5
      - name: Enrich independently verified paper abstracts only
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python scripts/ccf_paper_enrichment.py \
            --input ccf-r6-audit/verified_candidates.csv \
            --per-venue 5 --output-dir ccf-r6-work
      - name: Score using original Zotero reranker and replay three days
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          PYTHONPATH: src
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          test -n "$ZOTERO_ID" && test -n "$ZOTERO_KEY"
          python -m pip install 'pyzotero>=1.10,<2' 'sentence-transformers>=5,<6' 'transformers>=4.55,<5'
          python scripts/ccf_r6_replay.py --verified ccf-r6-audit/verified_candidates.csv \
            --enriched ccf-r6-work/enriched_candidates.csv \
            --history data/ccf_sent_history.json --out ccf-r6-audit/replay.json
      - name: Assert candidate state and sent history unchanged
        if: always()
        run: |
          sha256sum -c .r6-history-checksum
          test -z "$(git status --porcelain -- data/ccf_sent_history.json data/ccf_candidate_state.json)"
          echo 'No SMTP, no send, no persistent state changes.'
      - name: Upload audit even if partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccf-r6-verified-replay
          path: |
            ccf-r6-audit/
            ccf-r6-work/enrichment_audit.json
          retention-days: 7
          if-no-files-found: warn
