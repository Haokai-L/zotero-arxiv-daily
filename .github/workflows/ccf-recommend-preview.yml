name: CCF R4-1 Recommendation Preview
on:
  push:
    branches: [feature/ccf-a-daily]
    paths:
      - ".github/workflows/ccf-recommend-preview.yml"
      - "scripts/ccf_recommend_core.py"
      - "scripts/ccf_paper_enrichment.py"
      - "scripts/ccf_recommend_preview.py"
      - "tests/test_ccf_recommend.py"
      - "config/ccf_recommend.yaml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ccf-r41-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout developer branch
        uses: actions/checkout@v6
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install offline test dependencies
        run: python -m pip install "PyYAML>=6,<7" "numpy>=2,<3" "omegaconf>=2.3,<3" "openai>=2,<3" "tiktoken>=0.8,<1" "loguru>=0.7,<1"
      - name: Validate recommendation and original reranker
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_ccf_recommend.py -v
      - name: Download R3-4a audited CCF candidate snapshot
        uses: actions/download-artifact@v4
        with:
          name: ccf-unified-pool-r34a
          run-id: 45107717311
          github-token: ${{ github.token }}
          path: inputs/ccf-pool
      - name: Enrich CCF abstracts without preprint discovery
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python scripts/ccf_paper_enrichment.py \
            --input inputs/ccf-pool/candidates_preliminary.csv \
            --per-venue 4 \
            --output-dir ccf-r41-preview
      - name: Try actual Zotero scores (read-only, never send email)
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          PYTHONPATH: src
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          if [ -z "$ZOTERO_ID" ] || [ -z "$ZOTERO_KEY" ]; then
            echo '{"status":"SKIPPED_ZOTERO_CREDENTIALS_MISSING","email_sent":false}' > ccf-r41-preview/scoring_status.json
            echo 'Zotero read credentials not configured; real scoring not attempted.'
          else
            python -m pip install "pyzotero>=1.10,<2" "sentence-transformers>=5,<6"
            python scripts/ccf_recommend_preview.py \
              --input ccf-r41-preview/enriched_candidates.csv \
              --output ccf-r41-preview/recommendations.json \
              --max-corpus 150
          fi
      - name: Upload audit even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ccf-r41-preview
          path: ccf-r41-preview/
          retention-days: 7
          if-no-files-found: warn
