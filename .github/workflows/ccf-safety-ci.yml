name: CCF Safety CI (No Email)
on:
  push:
    branches: [feature/ccf-a-daily]
    paths:
      - '.github/workflows/ccf-safety-ci.yml'
      - 'scripts/**'
      - 'tests/test_ccf_*.py'
      - 'config/ccf_*.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ccf-safety-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-regression:
    if: github.ref == 'refs/heads/feature/ccf-a-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install CCF test dependencies without embedding model download
        run: |
          python -m pip install 'PyYAML>=6,<7' 'numpy>=2,<3' 'omegaconf>=2.3,<3' 'openai>=2,<3' 'tiktoken>=0.8,<1' 'loguru>=0.7,<1'
      - name: Run all retained CCF tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_ccf_*.py' -v
      - name: Assert sending remains disabled in preview
        run: |
          grep -q 'send_enabled: false' config/ccf_r5_mail.yaml
          grep -q 'preview_only: true' config/ccf_r5_mail.yaml
          test -z "$(git status --porcelain -- data/ccf_sent_history.json data/ccf_delivery_ledger.json)"
