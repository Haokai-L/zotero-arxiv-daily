
name: CCF Source Probe

on:
  push:
    branches:
      - feature/ccf-a-daily

permissions:
  contents: read

jobs:
  check-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install "PyYAML>=6,<7" "feedparser>=6,<7"

      - name: Validate CCF venues and DBLP RSS
        run: |
          python scripts/ccf_source_probe.py
