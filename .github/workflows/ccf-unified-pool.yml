name: CCF Unified Pool R3-4a

on:
  push:
    branches:
      - feature/ccf-a-daily
    paths:
      - ".github/workflows/ccf-unified-pool.yml"
      - "scripts/build_ccf_candidate_pool.py"
      - "tests/test_ccf_candidate_pool.py"
      - "docs/ccf-unified-pool.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: ccf-pool-r34a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consolidate-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install minimal dependencies
        run: python -m pip install "PyYAML>=6,<7"
      - name: Test normalization and deduplication offline
        run: python -m unittest discover -s tests -p test_ccf_candidate_pool.py -v
      - name: Get R3-2 journal audit snapshot
        uses: actions/download-artifact@v4
        with:
          name: ccf-journal-r32-audit
          run-id: 45035234003
          github-token: ${{ github.token }}
          path: inputs/journals
      - name: Get R3-3 conference audit snapshot
        uses: actions/download-artifact@v4
        with:
          name: ccf-conference-r33-audit
          run-id: 45105461913
          github-token: ${{ github.token }}
          path: inputs/conferences
      - name: Assemble auditable bounded preview pool
        run: |
          python scripts/build_ccf_candidate_pool.py \
            --journals inputs/journals \
            --conferences inputs/conferences \
            --whitelist config/ccf_a_venues.yaml \
            --as-of 2026-11-23 \
            --output ccf-unified-preview
      - name: Upload unified audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ccf-unified-pool-r34a
          path: ccf-unified-preview/
          retention-days: 7
          if-no-files-found: warn
